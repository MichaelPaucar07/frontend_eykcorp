server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # COMPRESIÓN DE RESPUESTAS DE TEXTO
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # REVERSE PROXY: /api/clientes -> ${BACKEND_URL}/clientes
    # (la "/" final de proxy_pass elimina el prefijo /api)
    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # ARCHIVOS ESTÁTICOS CON HASH EN EL NOMBRE: CACHÉ DE LARGA DURACIÓN
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: CUALQUIER RUTA DESCONOCIDA DEVUELVE index.html (Vue Router la resuelve)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
